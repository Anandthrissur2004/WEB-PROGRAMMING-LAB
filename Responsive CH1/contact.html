<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | RCH</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="./index.html" aria-label="Responsive Company home">RCH</a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
            Menu
        </button>

        <nav class="navbar" id="site-navigation" aria-label="Main navigation">
            <a href="./index.html">Home</a>
            <a href="./service.html">Services</a>
            <a href="./About.html">About</a>
            <a class="active" href="./contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact-layout">
            <div class="contact-intro">
                <p class="eyebrow">Let's talk</p>
                <h1>Have a good idea? Bring it here.</h1>
                <p>Tell us what you are working on and we will get back to you with a useful next step.</p>

                <div class="contact-details">
                    <p>
                        <strong>Email</strong>
                        <a href="mailto:anand@gmail.com">anand@gmail.com</a>
                    </p>
                    <p>
                        <strong>Phone</strong>
                        <a href="tel:+91XXXXXXX">+91 XXXXXXX</a>
                    </p>
                </div>
            </div>

            <form class="contact-form" id="contact-form">
                <label for="name">Your name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>

                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="message">What can we help with?</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button class="button" type="submit">
                    Send message <span aria-hidden="true">-&gt;</span>
                </button>

                <p class="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>Email: <a href="mailto:anand@gmail.com">anand@gmail.com</a></p>
        <p>Phone: <a href="tel:+91XXXXXXX">+91 XXXXXXX</a></p>
        <p>&copy; 2026 RCH. All rights reserved.</p>
    </footer>
</body>
</html>
